<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <title>Ilustração: Server Properties, página Security, com o modo de autenticação SQL Server e Windows</title>
  <rect x="10" y="10" width="660" height="260" rx="8" fill="#ffffff" stroke="#b9c0cc"/>
  <path d="M10 18a8 8 0 0 1 8-8h644a8 8 0 0 1 8 8v22H10z" fill="#eef1f5"/>
  <text x="26" y="31" font-weight="600" fill="#1d2330">Server Properties - MEU-SERVIDOR\SQLEXPRESS</text>
  <rect x="10" y="40" width="160" height="230" fill="#f6f8fb"/>
  <text x="26" y="66" fill="#1d2330">General</text>
  <text x="26" y="92" fill="#1d2330">Memory</text>
  <rect x="16" y="102" width="148" height="26" rx="3" fill="#dbe8fb"/>
  <text x="26" y="120" fill="#1d2330" font-weight="600">Security</text>
  <text x="26" y="148" fill="#1d2330">Connections</text>

  <text x="192" y="70" fill="#1d2330" font-weight="600">Server authentication</text>
  <circle cx="204" cy="100" r="6" fill="none" stroke="#6b7280"/>
  <text x="218" y="105" fill="#6b7280">Windows Authentication mode</text>
  <rect x="190" y="118" width="420" height="30" rx="4" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
  <circle cx="204" cy="133" r="6" fill="none" stroke="#1f6fd1" stroke-width="2"/><circle cx="204" cy="133" r="3" fill="#1f6fd1"/>
  <text x="218" y="138" fill="#1d2330" font-weight="700">SQL Server and Windows Authentication mode</text>
  <circle cx="640" cy="133" r="12" fill="#e8590c"/><text x="640" y="138" text-anchor="middle" fill="#fff" font-weight="700">7</text>
  <text x="192" y="184" fill="#4a5568">Clique com o botão direito no servidor → Properties → Security.</text>
  <text x="192" y="206" fill="#4a5568">Sem este modo, utilizadores com senha (como gateway_leitura) não entram.</text>
  <text x="192" y="228" fill="#4a5568">Depois de mudar, reinicie o serviço "SQL Server".</text>
</svg>
