<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <title>Ilustração: janela "Login - New", página General, com autenticação SQL Server</title>
  <rect x="10" y="10" width="660" height="380" rx="8" fill="#ffffff" stroke="#b9c0cc"/>
  <path d="M10 18a8 8 0 0 1 8-8h644a8 8 0 0 1 8 8v22H10z" fill="#eef1f5"/>
  <text x="26" y="31" font-weight="600" fill="#1d2330">Login - New</text>

  <rect x="10" y="40" width="160" height="350" fill="#f6f8fb"/>
  <text x="22" y="64" fill="#6b7280" font-size="11" font-weight="600">SELECT A PAGE</text>
  <rect x="16" y="74" width="148" height="26" rx="3" fill="#dbe8fb"/>
  <text x="26" y="92" fill="#1d2330" font-weight="600">General</text>
  <text x="26" y="120" fill="#1d2330">Server Roles</text>
  <text x="26" y="146" fill="#1d2330">User Mapping</text>
  <text x="26" y="172" fill="#1d2330">Securables</text>
  <text x="26" y="198" fill="#1d2330">Status</text>

  <text x="192" y="72" fill="#1d2330">Login name:</text>
  <rect x="300" y="56" width="300" height="26" rx="3" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
  <text x="310" y="74" fill="#1d2330" font-weight="600">gateway_leitura</text>
  <circle cx="630" cy="69" r="12" fill="#e8590c"/><text x="630" y="74" text-anchor="middle" fill="#fff" font-weight="700">3</text>

  <g fill="#1d2330">
    <circle cx="200" cy="112" r="6" fill="none" stroke="#6b7280"/>
    <text x="214" y="117" fill="#6b7280">Windows authentication</text>
    <circle cx="200" cy="142" r="6" fill="none" stroke="#1f6fd1" stroke-width="2"/>
    <circle cx="200" cy="142" r="3" fill="#1f6fd1"/>
    <text x="214" y="147" font-weight="600">SQL Server authentication</text>
  </g>
  <rect x="190" y="128" width="410" height="112" rx="5" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="630" cy="142" r="12" fill="#e8590c"/><text x="630" y="147" text-anchor="middle" fill="#fff" font-weight="700">4</text>
  <text x="230" y="178" fill="#1d2330">Password:</text>
  <rect x="340" y="162" width="250" height="24" rx="3" fill="#fff" stroke="#b9c0cc"/>
  <text x="350" y="179" letter-spacing="3" fill="#1d2330">••••••••••••</text>
  <text x="230" y="214" fill="#1d2330">Confirm password:</text>
  <rect x="340" y="198" width="250" height="24" rx="3" fill="#fff" stroke="#b9c0cc"/>
  <text x="350" y="215" letter-spacing="3" fill="#1d2330">••••••••••••</text>

  <rect x="214" y="256" width="13" height="13" rx="2" fill="#1f6fd1"/><path d="M216 262l3 3 6-6" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="236" y="267" fill="#1d2330">Enforce password policy</text>
  <rect x="214" y="282" width="13" height="13" rx="2" fill="#fff" stroke="#6b7280"/>
