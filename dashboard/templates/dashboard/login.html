{% extends "dashboard/base.html" %}
{% block title %}Entrar{% endblock %}
{% block body %}
<div class="login">
  <div class="panel">
    <div class="brand" style="margin-bottom:1rem">Gateway Fiscal<small>Origens → AGT</small></div>
    {% if form.errors %}<div class="msg error">Utilizador ou senha incorretos.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-row"><label for="id_username">Utilizador</label>{{ form.username }}</div>
      <div class="form-row"><label for="id_password">Senha</label>{{ form.password }}</div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn primary" type="submit" style="width:100%">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
