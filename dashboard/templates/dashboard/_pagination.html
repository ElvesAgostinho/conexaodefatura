{% if page.paginator.num_pages > 1 %}
<div class="pagination">
  <span>{{ page.paginator.count }} registos · página {{ page.number }} de {{ page.paginator.num_pages }}</span>
  <div class="actions">
    {% if page.has_previous %}<a class="btn sm" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.previous_page_number }}">‹ Anterior</a>{% endif %}
    {% if page.has_next %}<a class="btn sm" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.next_page_number }}">Seguinte ›</a>{% endif %}
  </div>
</div>
{% endif %}
